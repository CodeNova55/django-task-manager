{% extends "base.html" %}
{% block title %}Delete task{% endblock %}
{% block content %}
  <h2>Delete "{{ object.title }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a href="{% url 'task_list' %}">Cancel</a>
  </form>
{% endblock %}
