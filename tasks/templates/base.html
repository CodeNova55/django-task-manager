<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Task Manager{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: .75rem; margin-bottom: 1.5rem; }
    a, button.link { color: #0b5fff; text-decoration: none; background: none; border: 0; cursor: pointer; font: inherit; }
    .btn { background: #0b5fff; color: #fff; padding: .5rem 1rem; border-radius: 6px; border: 0; cursor: pointer; font: inherit; }
    .btn.danger { background: #d92d20; }
    .task { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; }
    .badge { font-size: .8rem; background: #eef2ff; padding: .15rem .5rem; border-radius: 999px; }
    form p { margin: .75rem 0; }
    input, textarea, select { width: 100%; padding: .5rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <nav>
    <strong><a href="{% url 'task_list' %}">Task Manager</a></strong>
    <div>
      {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button class="link" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a> · <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
